# Reglas didácticas de acceso. Modifique y observe el efecto en el sistema.

pico_y_placa:
  activo: true
  horarios:            # formato HH:MM, 24 h
    - inicio: "06:00"
      fin: "09:00"
    - inicio: "16:00"
      fin: "20:00"
  restricciones:       # último dígito restringido por día
    lunes: [1, 2]
    martes: [3, 4]
    miercoles: [5, 6]
    jueves: [7, 8]
    viernes: [9, 0]
    sabado: []
    domingo: []
  aplicar_en_festivos: false
  pais_festivos: "CO"

ocr:
  confianza_minima: 0.80
  idiomas: ["es"]
  caracteres_permitidos: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"

formato_placa:
  carro: "^[A-Z]{3}[0-9]{3}$"
  moto: "^[A-Z]{3}[0-9]{2}[A-Z]$"   # extensión opcional

# Correcciones típicas del OCR según la posición (letras en 1-3, números en 4-6)
correcciones:
  a_letra:  {"0": "O", "1": "I", "2": "Z", "5": "S", "8": "B", "6": "G"}
  a_numero: {"O": "0", "I": "1", "Z": "2", "S": "5", "B": "8", "G": "6", "D": "0", "Q": "0"}

preproceso:
  clahe_clip_limit: 2.0
  clahe_tamano_grilla: 8
  bilateral_diametro: 9
  bilateral_sigma_color: 75
  bilateral_sigma_espacio: 75
  canny_umbral_bajo: 50
  canny_umbral_alto: 150
  kernel_morfologico: 5

localizacion:
  hsv_amarillo_bajo: [15, 80, 80]    # H (0-179), S y V (0-255)
  hsv_amarillo_alto: [35, 255, 255]
  area_minima: 2000
  relacion_aspecto_esperada: 2.0     # ancho/alto real de la placa (2:1)
  tolerancia_aspecto: 0.6
  rectangularidad_minima: 0.6
  ancho_rectificado: 400
  alto_rectificado: 200

plc:
  host: "127.0.0.1"
  puerto: 502
  unidad: 1
  periodo_watchdog_s: 1.0
